name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for JSR's tokenless OIDC publish
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Format
        run: deno fmt --check

      - name: Lint
        run: deno lint

      - name: Typecheck
        run: deno task check

      - name: Test
        run: deno task test

      - name: Verify tag matches deno.json version
        run: |
          version="$(deno eval 'console.log(JSON.parse(await Deno.readTextFile("deno.json")).version)')"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match deno.json version $version (expected tag v$version)" >&2
            exit 1
          fi

      - name: Publish to JSR
        run: deno publish

  publish-npm:
    runs-on: ubuntu-latest
    needs: publish
    permissions:
      contents: read
      id-token: write # required for npm provenance attestation
    steps:
      - uses: actions/checkout@v5

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build npm package with dnt
        run: deno task build:npm "${GITHUB_REF_NAME#v}"

      - name: Smoke test the built package on Node
        run: |
          mkdir -p /tmp/smoke && cd /tmp/smoke
          npm init -y > /dev/null
          npm install --ignore-scripts "$GITHUB_WORKSPACE/npm"
          node --input-type=module -e "
            import { readFile } from 'node:fs/promises';
            const { parsePayload } = await import('@domaincanary/dmarc-rua');
            const { parseEmailAttachments } = await import('@domaincanary/dmarc-rua/email');
            const bytes = await readFile(process.env.GITHUB_WORKSPACE + '/tests/fixtures/google_report.xml');
            const reports = await parsePayload(bytes, 'google_report.xml');
            if (!reports.length || !reports[0].records.length) throw new Error('smoke test parsed nothing');
            if (typeof parseEmailAttachments !== 'function') throw new Error('email subpath broken');
            console.log('smoke ok:', reports[0].orgName, reports[0].records.length, 'records');
          "

      # Auth is npm trusted publishing (GitHub OIDC via id-token: write); no token anywhere.
      - name: Publish to npm
        run: npm publish --provenance --access public
        working-directory: npm
